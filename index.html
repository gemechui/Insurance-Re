<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ethiopian Insurance Corporation — track policy renewals across all branches, districts and products. Works offline.">
<meta name="theme-color" content="#1F3B8C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Ethiopian Insurance Corporation</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EIC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Ethiopian Insurance Corporation">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="./fonts.css">
<style>
/* ===================== Theme tokens ===================== */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#EBEEF4; --line:#D8DDE7; --line-soft:#E7EBF2;
  --fg:#161C2B; --muted:#5C6577; --muted-2:#8A93A6;
  --accent:#1F3B8C; --accent-2:#3461CA; --accent-fg:#FFFFFF; --accent-soft:#E6ECF8; --accent-line:#C9D5F0;
  --good:#157F4F; --good-soft:#DCF0E4; --warn:#8F5B00; --warn-soft:#FAEBC9; --bad:#B0302A; --bad-soft:#FADFDC;
  --shadow:0 1px 2px rgba(20,30,60,.04), 0 12px 36px rgba(20,30,60,.12);
  --shadow-pop:0 12px 44px rgba(20,30,60,.20);
  --radius:10px; --radius-sm:6px;
  --f-display:'Bricolage Grotesque','Noto Sans Ethiopic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Noto Sans Ethiopic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131F; --surface:#161D2E; --surface2:#202A41; --line:#2C3754; --line-soft:#232C46;
  --fg:#E6EAF3; --muted:#A6B1C8; --muted-2:#7B86A0;
  --accent:#8AA2F2; --accent-2:#5E78D8; --accent-fg:#0E131F; --accent-soft:#222E58; --accent-line:#3A4A78;
  --good:#5EC795; --good-soft:#173A2B; --warn:#E5B04F; --warn-soft:#3A2D11; --bad:#F28C84; --bad-soft:#431F1C;
  --shadow:0 12px 36px rgba(0,0,0,.45); --shadow-pop:0 18px 56px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131F; --surface:#161D2E; --surface2:#202A41; --line:#2C3754; --line-soft:#232C46;
  --fg:#E6EAF3; --muted:#A6B1C8; --muted-2:#7B86A0;
  --accent:#8AA2F2; --accent-2:#5E78D8; --accent-fg:#0E131F; --accent-soft:#222E58; --accent-line:#3A4A78;
  --good:#5EC795; --good-soft:#173A2B; --warn:#E5B04F; --warn-soft:#3A2D11; --bad:#F28C84; --bad-soft:#431F1C;
  --shadow:0 12px 36px rgba(0,0,0,.45); --shadow-pop:0 18px 56px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 var(--f-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:600}
h1{font-size:24px;line-height:1.2}
h2{font-size:16px;line-height:1.3}
h3{font-size:14px;line-height:1.3;font-weight:600;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;color:inherit;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}
hr{border:0;border-top:1px solid var(--line);width:100%}

/* ===================== Layout ===================== */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;max-width:1520px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px))}
.rail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 48px)}
.brand{display:flex;gap:12px;align-items:center;padding:4px 4px 12px;border-bottom:1px solid var(--line)}
.brand .brand-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto;box-shadow:var(--shadow);background:#fff;border:1px solid var(--line)}
.brand b{display:block;font:600 14px var(--f-display);line-height:1.25}
.brand span{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a[aria-current="page"] .badge{background:var(--accent);color:var(--accent-fg)}
.nav .badge{background:var(--bad);color:#fff;font:600 11px var(--f-body);padding:1px 7px;border-radius:99px;min-width:20px;text-align:center;line-height:1.5}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.rail-foot .row{align-items:center;justify-content:space-between}
.rail-foot button{padding:6px 9px;border-radius:6px;font-size:12px;color:var(--muted)}
.rail-foot button:hover{background:var(--surface);color:var(--fg)}

.main{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0}
.top .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .who{display:flex;align-items:center;gap:8px;font-size:13px}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font:500 11.5px var(--f-body);background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
label.f>span{font-size:11.5px;letter-spacing:.01em}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--fg);min-width:0;width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type="search"]{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235C6577' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>");background-repeat:no-repeat;background-position:9px center;padding-left:32px}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235C6577' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 9px center;padding-right:30px}
textarea{resize:vertical;min-height:60px;font-family:inherit}
input:disabled,select:disabled,textarea:disabled{background:var(--surface2);color:var(--muted-2);cursor:not-allowed}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--f-body);transition:background .12s,border-color .12s,transform .04s;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--accent-line)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 1px 2px rgba(20,30,60,.08)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.warn-outline{color:var(--warn);border-color:var(--line)}
.btn.warn-outline:hover{background:var(--warn-soft);border-color:var(--warn)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary[disabled]:hover{background:var(--accent)}

/* ===================== Panels, KPIs, tables ===================== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel>h2{margin-bottom:4px}
.panel>.sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.kpi{padding:16px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.kpi:first-child{border-left:0}
.kpi .l{font:500 11px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font:600 26px var(--f-display);letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:10px 0 4px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--line)}
.sub{color:var(--muted);font-size:12.5px;line-height:1.5}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font:600 11.5px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);background:transparent;position:sticky;top:0;background:var(--surface)}
td.r,th.r{text-align:right}
.tablewrap{overflow:auto;max-height:560px;border-radius:8px}
tbody tr{transition:background .08s}
tbody tr:hover{background:var(--surface2)}
tr.click{cursor:pointer}
tr.click{transition:background .08s}
tr.click:hover{background:var(--accent-soft)}
tr.click.selected{background:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent);font-weight:500}
tr.click.selected:hover{background:var(--accent);color:var(--accent-fg)}
tr.click.selected:hover .mono,tr.click.selected:hover .muted{color:var(--accent-fg)}
input[type="checkbox"]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
td .nm{font-weight:500;line-height:1.3}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bar label.f{flex:1 1 200px;min-width:160px}
.bar label.f.grow{flex:1 1 320px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button:hover{background:var(--surface2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tier{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.tier button{padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;transition:background .12s,border-color .12s}
.tier button:hover{background:var(--surface2);border-color:var(--accent-line)}
.tier button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tier .stripe{width:32px;height:3px;border-radius:2px;background:var(--line)}
.tier .stripe.bad{background:var(--bad)} .tier .stripe.warn{background:var(--warn)}
.tier .c{font:600 18px var(--f-display);line-height:1.1}
.tier .l{font-size:11.5px;color:var(--muted)}

/* ===================== Drawer / sheet ===================== */
.drawer{position:fixed;inset:0;display:flex;justify-content:flex-end;background:rgba(10,15,30,.45);z-index:30;animation:fade .14s ease-out}
.drawer[hidden]{display:none}
.sheet{width:min(540px,100%);height:100%;overflow-y:auto;background:var(--surface);box-shadow:var(--shadow-pop);padding:20px max(20px,env(safe-area-inset-right,0px)) 28px 20px;display:flex;flex-direction:column;gap:14px;animation:slide .18s ease-out}
.sheet h2{font-size:20px;overflow-wrap:anywhere}
.sheet h3{font-size:14px;font-weight:600;color:var(--fg)}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:13px}
dl.facts dt{color:var(--muted);font-weight:500}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:12.5px;min-height:18px}

/* ===================== Misc ===================== */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:90vw;box-shadow:var(--shadow-pop)}
.toast[hidden]{display:none}
.toast a{color:inherit;text-decoration:underline;font-weight:600;cursor:pointer;margin-left:8px}

/* PWA: install button, network status dot, update banner */
#installBtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--accent-line);border-radius:8px;background:var(--accent-soft);color:var(--accent);font:500 12.5px var(--f-body);cursor:pointer;width:100%;justify-content:center}
#installBtn:hover{background:var(--accent-line)}
.net-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);flex:0 0 auto;transition:background .2s}
.net-dot.offline{background:var(--bad)}
.net-dot.uncached{background:var(--warn)}
.update-banner{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:90vw;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:10px}
.update-banner[hidden]{display:none}
.update-banner button{background:rgba(255,255,255,.18);color:var(--accent-fg);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:6px;font:600 12.5px var(--f-body)}
.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;padding:11px 14px;font-size:13px}
.note.warn{border-left-color:var(--warn)} .note.bad{border-left-color:var(--bad)} .note.good{border-left-color:var(--good)}
.note b{font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:600 16px var(--f-display);margin-bottom:6px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;gap:5px;align-items:center;padding:3px 9px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:var(--surface);cursor:pointer}
.chk:hover{border-color:var(--accent-line)}
.digest{width:100%;min-height:240px;font:12.5px/1.55 var(--f-mono);resize:vertical}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog>div{height:100%;background:var(--accent);width:0;transition:width .12s ease}
.hbar{height:8px;background:var(--surface2);border-radius:2px;min-width:60px;overflow:hidden}
.hbar>div{height:100%;background:var(--good);border-radius:2px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin-bottom:4px}
svg .grid{stroke:var(--line);stroke-width:1}
svg text{fill:var(--muted);font:11px var(--f-body)}
svg text.cur{fill:var(--accent);font-weight:600}

/* Add-policy form */
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.addgrid .full{grid-column:1/-1}
.addgrid label.f>span{font-size:11.5px}
.req::after{content:"*";color:var(--bad);margin-left:2px}

/* Helpers for in-line grid overrides that should still collapse at small widths */
.cols2.ratio-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:1080px){.cols2.ratio-3-2{grid-template-columns:minmax(0,1fr)}}

/* Mobile nav: subtle right-edge fade to signal there's more to scroll */
@media (max-width:820px){
  .nav{position:relative;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 24px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 24px),transparent 100%)}
  /* On mobile, anchor the toast higher (above the bottom of the page) so it doesn't overlap
     the bottom drawer buttons or the table header. */
  .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));max-width:calc(100vw - 24px)}
  .update-banner{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px));max-width:calc(100vw - 24px)}
}

/* Validation grid */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.vcard{padding:14px;background:var(--surface2);border-radius:8px;border:1px solid var(--line)}
.vcard.ok{border-left:3px solid var(--good)} .vcard.warn{border-left:3px solid var(--warn)} .vcard.bad{border-left:3px solid var(--bad)}
.vcard .l{font:500 11px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.vcard .v{font:600 22px var(--f-display);margin-top:2px}
.vcard .d{font-size:12px;color:var(--muted);margin-top:2px}

/* ===================== Animations ===================== */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(20px);opacity:.5}to{transform:translateX(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===================== Responsive ===================== */
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(n+3){border-top:1px solid var(--line)}.kpi:nth-child(3){border-left:0}.grid2,.cols2{grid-template-columns:minmax(0,1fr)}.tier{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px;padding:16px max(14px,env(safe-area-inset-right,0px)) 32px max(14px,env(safe-area-inset-left,0px))}
  .rail{position:static;max-height:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .nav a{white-space:nowrap;padding:7px 11px;font-size:13px}
  .nav a[aria-current="page"]{box-shadow:0 2px 0 var(--accent) inset,0 0 0 1px var(--accent-line) inset;background:transparent;color:var(--accent)}
  .top h1{font-size:22px}
  .formgrid{grid-template-columns:1fr}
  .addgrid{grid-template-columns:1fr}
  .tier{grid-template-columns:repeat(2,1fr)}
  .bar label.f{flex:1 1 140px}.bar .grow{flex:1 1 100%}
}

/* ===================== Print ===================== */
/* Print-only report header — appears at the top of every printed PDF, hidden on screen */
.print-header{display:none}
@media print{
  body{background:#fff;color:#000;font-size:11px;padding:0}
  .rail,.drawer,.toast,.rail-foot,.update-banner,#pdfBtn{display:none!important}
  .app{display:block;padding:0;max-width:none}
  .main{display:block}
  .panel{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .kpis{grid-template-columns:repeat(4,1fr);border:1px solid #ccc}
  .kpi .v{font-size:18px}
  th,td{padding:6px 8px;border:1px solid #ddd}
  .grid2,.cols2{grid-template-columns:1fr 1fr}

  /* Show the report header at the top of every printed page */
  .print-header{display:flex;align-items:flex-start;gap:14px;padding:0 0 14px;border-bottom:2px solid #1F3B8C;margin-bottom:18px;break-inside:avoid;break-after:avoid}
  .print-header .print-logo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid #1F3B8C;background:#fff}
  .print-header .print-brand{flex:1 1 auto}
  .print-header .print-org{font:700 16px 'Bricolage Grotesque','IBM Plex Sans',serif;color:#1F3B8C;line-height:1.2}
  .print-header .print-report{font:600 13px 'IBM Plex Sans',sans-serif;color:#000;margin-top:3px;line-height:1.3}
  .print-header .print-meta{font:11px 'IBM Plex Mono',monospace;color:#444;text-align:right;line-height:1.5}
  .print-header .print-meta div{white-space:nowrap}

  /* Hide the on-screen header on print */
  .top,#title{display:none!important}

  /* Keep table headers from breaking away from rows + allow tables to paginate */
  thead{display:table-header-group}
  tbody{break-inside:auto}
  tr{break-inside:avoid;break-after:auto}
  .tablewrap{max-height:none!important;overflow:visible!important}

  /* Page footer with date + page number — @page margin content. Chromium-based
     browsers populate counter(page)/counter(pages) correctly both via window.print()
     and via programmatic page.pdf(). */
  @page{margin:18mm 12mm 18mm}
  @page {
    @bottom-center {
      content: "Ethiopian Insurance Corporation · Page " counter(page) " of " counter(pages);
      font: 10px 'IBM Plex Mono', monospace;
      color: #666;
    }
  }
}

/* Tighten the Reports table padding/font for print so all 8 columns fit on A4 portrait */
@media print{
  .main[data-view="reports"] table{font-size:10px;border-collapse:collapse}
  .main[data-view="reports"] th,.main[data-view="reports"] td{padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
</style>

/* ===================== Local backend (replaces Claude.ai APIs) ===================== */
/*   track bucket    : Map<key, {office,district,month,recs:{pid:{...}}}>   */
/*   staff           : Map<uid, {name,role,districts,email,active}>         */
/*   addedPolicies    : Map<pid, row>                                         */
const LocalDB={
  _read(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}},
  _write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Local storage is full or unavailable')}},

  track:new Map(),
  staff:new Map(),
  added:new Map(),
  edits:new Map(),
  deleted:new Set(),
  deletedRows:new Map(),

  load(){
    this.track=new Map(Object.entries(this._read('irm.track',{})));
    this.staff=new Map(Object.entries(this._read('irm.staff',{})));
    this.added=new Map(Object.entries(this._read('irm.added',{})));
    this.edits=new Map(Object.entries(this._read('irm.edits',{})).map(([k,v])=>[Number(k),v]));
    this.deleted=new Set((this._read('irm.deleted',[])||[]).map(Number));
    this.deletedRows=new Map(Object.entries(this._read('irm.deletedRows',{})).map(([k,v])=>[Number(k),v]));
  },
  saveTrack(){this._write('irm.track',Object.fromEntries(this.track))},
  saveStaff(){this._write('irm.staff',Object.fromEntries(this.staff))},
  saveAdded(){this._write('irm.added',Object.fromEntries(this.added))},
  saveEdits(){this._write('irm.edits',Object.fromEntries([...this.edits.entries()].map(([k,v])=>[String(k),v])))},
  saveDeleted(){this._write('irm.deleted',[...this.deleted])},
  saveDeletedRows(){this._write('irm.deletedRows',Object.fromEntries([...this.deletedRows.entries()].map(([k,v])=>[String(k),v])))},

  /* Firestore-like collection('track').doc(key) — minimal subset of what the original code uses */
  collection(name){
    const self=this;
    return {
      doc(id){
        return {
          async get(){
            const store = name==='track'?self.track:name==='staff'?self.staff:null;
            if(!store) return {exists:false,data:()=>null};
            return {exists:store.has(id),data:()=>store.get(id)||null};
          },
          async set(data){
            if(name==='track'){self.track.set(id,data);self.saveTrack()}
            else if(name==='staff'){self.staff.set(id,data);self.saveStaff()}
          },
          async update(patch){
            if(name==='track'){const cur=self.track.get(id)||{};const mp=Object.assign({},patch);if(patch.recs&&cur.recs)mp.recs=Object.assign({},cur.recs,patch.recs);self.track.set(id,Object.assign({},cur,mp));self.saveTrack()}
            else if(name==='staff'){const cur=self.staff.get(id)||{};self.staff.set(id,Object.assign({},cur,patch));self.saveStaff()}
          },
          async delete(){
            if(name==='track'){self.track.delete(id);self.saveTrack()}
            else if(name==='staff'){self.staff.delete(id);self.saveStaff()}
          },
          onSnapshot(cb,errCb){
            /* Fire once with the current state. Local mode has no realtime updates. */
            const store = name==='track'?self.track:name==='staff'?self.staff:null;
            if(!store){errCb&&errCb({code:'no-such-collection'});return ()=>{}}
            try{
              const docs=[...store.entries()].map(([k,v])=>({id:k,data:()=>v}));
              cb({docs,metadata:{fromCache:false}});
            }catch(e){errCb&&errCb(e)}
            return ()=>{};
          }
        };
      }
    };
  }
};

/* ===================== Tracking index ===================== */
function rebuild(){
  S.tidx=new Map();S.addedBy=new Map();
  for(const[key,d]of S.trackDocs){const recs=d.recs||{};
    for(const pid in recs){const r=recs[pid],id=Number(pid);
      S.tidx.set(id,{rec:r,office:d.office,district:d.district,month:d.month,key});
      if(r.add){const di=S.meta.districts.findIndex(x=>x.n===d.district);
        const row=[r.no||'',id,r.nm||'',d.office,r.pd>=0?S.meta.products[r.pd]||r.pn||'':r.pn||'',r.sc>=0?S.meta.sectors[r.sc]||'':'',r.end,r.pr||0,r.sm||0,di>=0?di:d.district];
        if(!S.addedBy.has(d.district))S.addedBy.set(d.district,[]);S.addedBy.get(d.district).push(row)}}}
  /* Also fold in manually-added policies that don't have a tracking record yet */
  for(const[id,row]of LocalDB.added){
    if(!S.tidx.has(id)){
      const dn=dName(row),key=bkey(oName(row),row[6],id);
      const rec={s:'',rp:'',rs:-1,as:'',nt:'',pr:row[7],pd:S.meta.products.indexOf(pName(row)),by:'local-admin',at:Math.floor(Date.now()/1000),add:1,no:row[0],nm:row[2],sc:S.meta.sectors.indexOf(sName(row)),end:row[6],sm:row[8]};
      S.tidx.set(id,{rec,office:oName(row),district:dn,month:row[6].slice(0,7),key});
      if(!S.addedBy.has(dn))S.addedBy.set(dn,[]);S.addedBy.get(dn).push(row);
      S.trackDocs.set(key,{office:oName(row),district:dn,month:row[6].slice(0,7),recs:{[String(id)]:rec}});
    }
  }
  S.tv++;S.rcache={};
}

async function deletePolicy(id, optRow){
  /* Capture metadata before deletion so the policy can be restored later. */
  const trec=S.tidx.get(id);

  const edit=LocalDB.edits.get(id);
  /* Find the row to display in the restore list — priority: manually-added → caller-supplied → currently-filtered list → reconstructed from tracking record. */
  let row=addedRow;
  if(!row && optRow) row=optRow;
  if(!row && S.list) row=S.list.find(r=>r[1]===id);
  if(!row && trec && trec.rec && trec.rec.add){
    const di=S.meta.districts.findIndex(d=>d.n===trec.district);
    const oi=S.meta.offices.findIndex(o=>o.n===trec.office);
    row=[trec.rec.no||'', id, trec.rec.nm||'', oi>=0?oi:trec.office, trec.rec.pd>=0?trec.rec.pd:-1, trec.rec.sc>=0?trec.rec.sc:-1, trec.rec.end||'', trec.rec.pr||0, trec.rec.sm||0, di>=0?di:trec.district];
  }
  const meta={wasAdded:!!addedRow, deletedAt:Date.now()};
  if(row) meta.row=row;
  if(trec) meta.track={office:trec.office, district:trec.district, month:trec.month, key:trec.key, rec:trec.rec};
  if(edit) meta.edit=edit;
  LocalDB.deletedRows.set(id, meta);LocalDB.saveDeletedRows();

  LocalDB.deleted.add(id);LocalDB.saveDeleted();

async function restorePolicy(id){

    if(meta.wasAdded && meta.row){LocalDB.added.set(id, meta.row);LocalDB.saveAdded()}
    if(meta.track){const key=meta.track.key;const td=S.trackDocs.get(key)||{office:meta.track.office,district:meta.track.district,month:meta.track.month,recs:{}};td.recs[String(id)]=meta.track.rec;S.trackDocs.set(key,td);LocalDB.track.set(key,td);LocalDB.saveTrack()}
    if(meta.edit){LocalDB.edits.set(id, meta.edit);LocalDB.saveEdits()}

  }

function rowsFor(name){

  return S.pending[sl]}

/* ===================== Aggregation ===================== */
function distIdx(){return S.scope&&S.scope!=='__all'?S.meta.districts.findIndex(d=>d.n===S.scope):null}
function report(by,allDistricts){
  const m=S.meta,sd=allDistricts?null:distIdx(),g=new Map();
  /* Each group tracks: count, premium, sum insured, plus per-status counters (R, N, NEW, Open) */
  const grp=k=>{let x=g.get(k);if(!x){x={key:k,count:0,prem:0,sum:0,R:0,N:0,NEW:0,Rp:0,Np:0,NEWp:0,Rc:0,Nc:0};g.set(k,x)}return x};
  /* For the 'status' grouping, the totals (count/prem/sum) come from summing all in-scope
     agg rows ONCE (regardless of product). Status sub-counts (R/N/NEW) come from the tracking
     index + added-policies loops below. */
  if(by==='status'){
    /* One synthetic group per status code: '_open' (no status), 'NEW', 'R', 'N' */
    const groupKeys=['_open','NEW','R','N'];
    /* First pass: total policies + premium + sum from agg (in scope). */
    let totalCount=0,totalPrem=0,totalSum=0;
    for(const a of m.agg){if(sd!=null&&a[0]!==sd)continue;totalCount+=a[4];totalPrem+=a[5];totalSum+=a[6]}
    /* Initialize each status group with zero; we'll fill count/prem from the tidx loop. */
    for(const k of groupKeys){grp(k)}
    /* Now walk the tracking index and added policies, counting each policy into its status bucket. */
    const countInto=(statusKey,pr,sumIns,skipAddRec)=>{
      const x=g.get(statusKey)||grp(statusKey);
      x.count++; x.prem+=pr||0; x.sum+=sumIns||0;
      if(statusKey==='R'){x.R++;x.Rp+=pr||0}
      else if(statusKey==='N'){x.N++;x.Np+=pr||0}
      else if(statusKey==='NEW'){x.NEW++;x.NEWp+=pr||0}
    };
    for(const[,c]of S.tidx){const r=c.rec;if(r.add)continue;
      const di=m.districts.findIndex(d=>d.n===c.district);if(sd!=null&&di!==sd)continue;
      countInto(r.s||'_open', r.pr||0, r.sm||0)}
    for(const[id,row]of LocalDB.added){
      const di=m.districts.findIndex(d=>d.n===dName(row));if(sd!=null&&di!==sd)continue;
      const rec=recOf(row);
      countInto(rec&&rec.s||'_open', row[7]||0, row[8]||0)}
    /* Open count = total policies - decided (R+N+NEW). Use the agg-derived total when
       tracking is sparse, so the Open row shows the real total minus the decided ones. */
    const decidedTotal=g.get('R').count+g.get('N').count+g.get('NEW').count;
    if(decidedTotal < totalCount){
      /* Adjust the _open group to take the remainder */
      const open=g.get('_open');
      const trueOpen=totalCount-decidedTotal;
      const trueOpenPrem=totalPrem-g.get('R').prem-g.get('N').prem-g.get('NEW').prem;
      const trueOpenSum=totalSum-g.get('R').sum-g.get('N').sum-g.get('NEW').sum;
      open.count=trueOpen; open.prem=trueOpenPrem; open.sum=trueOpenSum;
    }
  } else {
    /* Standard grouping (district/office/month/product): walk the agg array. */
    for(const a of m.agg){if(sd!=null&&a[0]!==sd&&by!=='district')continue;
      const k=by==='district'?a[0]:by==='office'?a[1]:by==='month'?a[2]:a[3];
      const x=grp(k);x.count+=a[4];x.prem+=a[5];x.sum+=a[6]}
    for(const[,c]of S.tidx){const r=c.rec;if(r.add)continue;
      const di=m.districts.findIndex(d=>d.n===c.district);if(sd!=null&&di!==sd&&by!=='district')continue;
      const k=by==='district'?di:by==='office'?m.offices.findIndex(o=>o.n===c.office):by==='month'?c.month:r.pd;
      if(!g.has(k))continue;const x=g.get(k);
      if(r.s==='R'){x.R++;x.Rp+=r.pr||0}else if(r.s==='N'){x.N++;x.Np+=r.pr||0}else if(r.s==='NEW'){x.NEW++;x.NEWp+=r.pr||0}}
    /* Include manually-added policies into the aggregates too */
    for(const[id,row]of LocalDB.added){
      const di=m.districts.findIndex(d=>d.n===dName(row));
      if(sd!=null&&di!==sd&&by!=='district')continue;
      const k=by==='district'?di:by==='office'?m.offices.findIndex(o=>o.n===oName(row)):by==='month'?row[6].slice(0,7):m.products.indexOf(pName(row));
      let x=g.get(k);if(!x){x={key:k,count:0,prem:0,sum:0,R:0,N:0,NEW:0,Rp:0,Np:0,NEWp:0,Rc:0,Nc:0};g.set(k,x)}
      x.count+=1;x.prem+=row[7];x.sum+=row[8];
      const rec=recOf(row);
      if(rec&&rec.s==='R'){x.R++;x.Rp+=rec.pr||row[7]||0}else if(rec&&rec.s==='N'){x.N++;x.Np+=rec.pr||row[7]||0}else if(rec&&rec.s==='NEW'){x.NEW++;x.NEWp+=rec.pr||row[7]||0}
    }
  }
  const out=[...g.values()].map(x=>{
    x.label=by==='district'?(m.districts[x.key]?m.districts[x.key].n:'?'):by==='office'?(m.offices[x.key]?m.offices[x.key].n:'?'):by==='month'?fm(x.key):by==='status'?(
      x.key==='_open'?'Open (no status)':x.key==='R'?'Renewed':x.key==='N'?'Not renewed':x.key==='NEW'?'New':'Other'
    ):(m.products[x.key]||'Other');
    x.decided=x.R+x.N+x.NEW;x.rate=x.decided?(x.R+x.NEW)/x.decided:null;x.open=x.count-x.decided;x.openp=x.prem-x.Rp-x.Np-x.NEWp;return x});
  if(by==='month')out.sort((a,b)=>a.key<b.key?-1:1);
  else if(by==='status')out.sort((a,b)=>(['_open','NEW','R','N'].indexOf(a.key))<(['_open','NEW','R','N'].indexOf(b.key))?-1:1);
  else out.sort((a,b)=>b.count-a.count);
  return out}

/* ===================== Shell rendering ===================== */
function setBanner(){
  /* The top banner now shows contextual, scope-aware notifications instead of
     the constant "Standalone mode" note. Use cases, in priority order:
       1. Tracking error                — red, "Tracking data could not be read"
       2. Loading scope                 — info, "Loading <district>…"
       3. Offline                       — warn, "You are offline — the app still works"
       4. Urgent expiry within 7 days   — bad (red), "X policies expire within 7 days in <scope>"
       5. Past-due with no status       — warn, "X policies expired before <month> without a status"
       6. Renewal progress              — info, "Outcomes recorded for X of Y policies (Z%)"
     The local-mode hint is shown only on first visit (using sessionStorage). */
  const b=[];
  if(S.trackErr){b.push('<div class="note bad">'+t('data.could_not')+' '+esc(S.trackErr.code||'error')+'</div>')}
  else if(S.loadingScope){b.push('<div class="note">'+t('banner.loading').replace('{n}',esc(S.scope==='__all'?t('reports.all_districts'):S.scope))+'</div>')}
  else if(typeof navigator!=='undefined'&&!navigator.onLine){b.push('<div class="note warn">'+t('pwa.offline')+'</div>')}
  else{
    /* Compute scope-specific metrics for the contextual notifications. */
    const rows=scopeRows();
    if(rows){
      /* 4. Urgent expiry within 7 days */
      let urgent=0;for(const r of rows){const d=dte(r[6]);if(d>=0&&d<=7&&isOpen(recOf(r)))urgent++}
      if(urgent>0){
        const scopeLbl=S.scope==='__all'||!S.scope?t('reports.all_districts'):S.scope;
        b.push('<div class="note bad"><b>'+fmt0(urgent)+'</b> '+t('banner.urgent').replace('{scope}',esc(scopeLbl))+'</div>');
      }
      /* 5. Past-due with no status */
      const mon=report('month');
      let pastOpen=0;for(const x of mon)if(x.key<NOW_M)pastOpen+=x.count-x.R-x.N-x.NEW;
      if(pastOpen>0){
        b.push('<div class="note warn"><b>'+fmt0(pastOpen)+'</b> '+t('banner.past_due').replace('{month}',fm(NOW_M))+'</div>');
      }
      /* 6. Renewal progress — only show when outcomes have been recorded */
      const dist=report('district');const sd=distIdx();const dsel=sd==null?dist:dist.filter(x=>x.key===sd);
      let count=0,R=0,N=0,NEW=0;for(const x of dsel){count+=x.count;R+=x.R;N+=x.N;NEW+=x.NEW}
      const decided=R+N+NEW;
      if(decided>0&&decided<count){
        const pctVal=count?(decided/count):0;
        b.push('<div class="note">'+t('banner.progress').replace('{decided}',fmt0(decided)).replace('{count}',fmt0(count)).replace('{pct}',pct(pctVal))+'</div>');
      } else if(decided===0&&!S.loadingScope){
        /* First-visit hint about local mode — only show once per session. */
        let seen=null;try{seen=sessionStorage.getItem('irm.bannerHintSeen')}catch(e){}
        if(!seen){
          b.push('<div class="note">'+t('banner.local')+'</div>');
          try{sessionStorage.setItem('irm.bannerHintSeen','1')}catch(e){}
        }
      }
    }
  }
  $('#banner').innerHTML=b.join('')}

function filterRows(rows,f){
  const q=f.q.trim().toLowerCase(),out=[];
  for(const r of rows){
    if(q&&!(r[2].toLowerCase().includes(q)||r[0].toLowerCase().includes(q)||String(r[1]).includes(q)))continue;
    const rec=recOf(r);
    if(f.status==='open'&&!isOpen(rec))continue;
    if(f.status==='R'&&!(rec&&rec.s==='R'))continue;
    if(f.status==='N'&&!(rec&&rec.s==='N'))continue;
    if(f.status==='NEW'&&!(rec&&rec.s==='NEW'))continue;
    if(f.status==='none'&&rec&&rec.s)continue;
    if(f.win!=='all'){if(f.win.startsWith('m:')){if(r[6].slice(0,7)!==f.win.slice(2))continue}else if(tierOf(dte(r[6]))!==f.win)continue}
    if(f.office&&oName(r)!==f.office)continue;
    if(f.prod&&pName(r)!==f.prod)continue;
    if(f.assign==='me'&&!(rec&&rec.as===S.uid))continue;
    if(f.assign==='none'&&rec&&rec.as)continue;
    if(f.assign!=='all'&&f.assign!=='me'&&f.assign!=='none'&&!(rec&&rec.as===f.assign))continue;
    out.push(r)}
  const s=f.sort;out.sort(s==='end'?(a,b)=>a[6]<b[6]?-1:a[6]>b[6]?1:0:s==='endd'?(a,b)=>a[6]<b[6]?1:a[6]>b[6]?-1:0:s==='prem'?(a,b)=>b[7]-a[7]:(a,b)=>a[2].localeCompare(b[2]));
  return out}

function alertSets(rows){

  sets.exp.sort((a,b)=>a[6]<b[6]?1:-1);for(const k of['t7','t30','t60','t90'])sets[k].sort((a,b)=>a[6]<b[6]?-1:a[6]>b[6]?1:0);
  return sets}

  function refillBranches(){
    const dn=$('#ap_district').value;
    const di=dn?m.districts.findIndex(d=>d.n===dn):-1;
    const branches=di>=0?m.offices.filter(o=>o.d===di).map(o=>o.n):[];
    const cur=$('#ap_branch').value;
    $('#ap_branch').innerHTML='<option value="">—</option>'+branches.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');

  $('#ap_district').onchange=refillBranches;

  $('#addForm').onsubmit=async(e)=>{
    e.preventDefault();
    const err=$('#ap_err');err.textContent='';
    const no=$('#ap_no').value.trim(),
      idRaw=$('#ap_id').value.trim(),
      id=Number(idRaw.replace(/\D/g,'')),
      name=$('#ap_name').value.trim(),
      district=$('#ap_district').value,
      branch=$('#ap_branch').value,
      product=$('#ap_product').value,
      sector=$('#ap_sector').value,
      end=$('#ap_end').value,
      prem=parseFloat($('#ap_prem').value),
      sum=parseFloat($('#ap_sum').value),
      status=$('#ap_status').value,
      rp=$('#ap_rp').value.trim(),
      reason=+$('#ap_reason').value,
      notes=$('#ap_notes').value.trim();

    if(!no||!id||!name||!district||!branch||!product||!sector||!end||!prem||!sum){err.textContent=t('add.err_required');return}

    if(isNaN(prem)||prem<0){err.textContent=t('add.err_premium');return}
    if(isNaN(sum)||sum<0){err.textContent=t('add.err_sum');return}
    if(status==='R'&&!rp){err.textContent=t('add.err_rp');return}
    if(status==='R'&&rp&&!/^\d{6,}$/.test(rp)){err.textContent=t('add.err_rp');return}
    if(status==='N'&&reason<0){err.textContent=t('add.err_reason');return}
    if(status==='N'&&/other/i.test(reasonTxt(reason))&&!notes){err.textContent=t('add.err_note');return}

    /* duplicate check across master data + added + tracked */
    if(S.tidx.has(id)){err.textContent=t('add.err_dup');return}
    const dn=m.districts.find(d=>d.n===district);
    const mp=new Map();const arr=await loadDistrict(district);if(arr)for(const r of arr)mp.set(r[1],r);
    if(mp.has(id)){err.textContent=t('add.err_dup');return}

    const di=m.districts.findIndex(d=>d.n===district);
    const oi=m.offices.findIndex(o=>o.n===branch);
    const pd=m.products.indexOf(product);
    const sc=m.sectors.indexOf(sector);
    const row=[no,id,name,oi,pd,sc,end,prem,sum,di];

    LocalDB.added.set(id,row);LocalDB.saveAdded();

    /* Also create a tracking record so the renewal status / reason / rp are stored */
    const rec={s:status,rp:status==='R'?rp:'',rs:status==='N'?reason:-1,as:'',nt:notes,pr:prem,pd,pn:product,by:S.uid||'',at:Math.floor(Date.now()/1000),add:1,no,nm:name,sc,end,sm:sum};
    const key=bkey(branch,end,id);
    S.trackDocs.set(key,{office:branch,district,month:end.slice(0,7),recs:{[String(id)]:rec}});
    LocalDB.track.set(key,S.trackDocs.get(key));LocalDB.saveTrack();
    rebuild();

    $('#ap_added').innerHTML=`<div class="note good"><b>${esc(t('add.added_h'))}.</b> ${esc(t('add.added_s'))} <a href="#policies" class="pill accent" style="margin-left:6px">${esc(t('nav.policies'))}</a></div>`;
    toast(t('toast.added'));
    /* Reset the form for the next entry, but keep district+branch selected for batch entry */
    ['ap_no','ap_id','ap_name','ap_prem','ap_sum','ap_rp','ap_notes'].forEach(k=>{const x=$('#'+k);if(x)x.value=''});
    $('#ap_status').value='NEW';$('#ap_reason').value='-1';syncStatus();
    $('#ap_no').focus();
  };
  $('#addForm').onreset=()=>{setTimeout(()=>{syncStatus();$('#ap_added').innerHTML='';/* Restore the default 'NEW' status selection on reset */const ap=document.querySelector('#ap_status');if(ap){ap.value='NEW';syncStatus();}},0)};
}

async function saveFile(name,data){
  if(!S.dlCap){toast('File saving is not available in this view.');return}
  try{await S.dlCap.save({filename:name,data});toast(t('toast.saved')+' '+name)}catch(e){if(e&&e.code==='declined')return;toast('Could not save the file ('+(e&&e.code||'error')+').')}}
function sheetRow(r){const rec=recOf(r);return[r[0],r[1],r[2],oName(r),dName(r),pName(r),sName(r),new Date(r[6]+'T12:00:00'),r[7],r[8],rec&&rec.s==='R'?'Renewed':rec&&rec.s==='N'?'Not renewed':rec&&rec.s==='NEW'?'New':'',rec&&rec.rp||'',rec&&rec.s==='N'?reasonTxt(rec.rs):'',rec&&rec.as?nm(rec.as):'',rec&&rec.nt||'']}
async function exportRows(list,name){
  if(typeof XLSX==='undefined'){toast('The Excel library did not load. Check your connection and reload.');return}
  if(!list.length){toast('Nothing to export.');return}
  const head=['POLICY_NO','POLICY_ID','NAME','OFFICE_NAME','DISTRICT','PRODUCT_TYPE','SECTOR','INSR_END','NET_PREMIUM','SUM_INSURED','RENEWAL_STATUS','RENEWAL POLICY ID','REASON FOR NON RENEWAL','ASSIGNED_TO','NOTES'];
  const ws=XLSX.utils.aoa_to_sheet([head].concat(list.map(sheetRow)),{cellDates:true});
  ws['!cols']=[22,14,36,22,14,34,18,12,14,16,16,16,30,18,30].map(w=>({wch:w}));
  const range=XLSX.utils.decode_range(ws['!ref']);for(let R=1;R<=range.e.r;R++){const d=ws[XLSX.utils.encode_cell({r:R,c:7})];if(d)d.z='dd-mmm-yy';for(const c of[8,9]){const x=ws[XLSX.utils.encode_cell({r:R,c})];if(x)x.z='#,##0.00'}}
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'RENEWAL LIST');
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});await saveFile(name,new Blob([buf]))}
function parseEnd(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return isoOf(d)}
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5)+12*36e5);return d.toISOString().slice(0,10)}
  const s=String(v||'').trim();let m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{2,4})$/);
  if(m){const mi=MN.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(mi+1)+'-'+pad(+m[1])}}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null}
async function readWorkbook(file){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const out=[],sheets=[];
  for(const name of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
    let h=-1;for(let i=0;i<Math.min(6,rows.length);i++){const up=rows[i].map(x=>String(x==null?'':x).trim().toUpperCase());if(up.includes('POLICY_ID')&&up.includes('INSR_END')){h=i;break}}
    if(h<0)continue;const head=rows[h].map(x=>String(x==null?'':x).trim().toUpperCase()),ix=k=>head.indexOf(k);
    const c={no:ix('POLICY_NO'),id:ix('POLICY_ID'),nm:ix('NAME'),of:ix('OFFICE_NAME'),di:ix('DISTRICT'),pr:ix('PRODUCT_TYPE'),sc:ix('SECTOR'),en:ix('INSR_END'),np:ix('NET_PREMIUM'),si:ix('SUM_INSURED'),st:ix('RENEWAL_STATUS'),rp:ix('RENEWAL POLICY ID'),rs:ix('REASON FOR NON RENEWAL')};
    let n=0;for(let i=h+1;i<rows.length;i++){const x=rows[i];if(!x||x[c.id]==null)continue;n++;
      out.push({sheet:name,line:i+1,no:String(x[c.no]??'').trim(),id:Number(String(x[c.id]).replace(/\D/g,'')),nm:String(x[c.nm]??'').trim(),office:String(x[c.of]??'').trim(),dist:String(x[c.di]??'').trim(),prod:String(x[c.pr]??'').trim(),sec:String(x[c.sc]??'').trim(),end:parseEnd(x[c.en]),prem:+x[c.np]||0,sum:+x[c.si]||0,st:String(x[c.st]??'').trim().toLowerCase(),rp:String(x[c.rp]??'').trim(),rs:String(x[c.rs]??'').trim()})}
    sheets.push(name+' ('+fmt0(n)+' rows)')}
  return{rows:out,sheets}}
async function planImport(file,setMsg){
  const{rows,sheets}=await readWorkbook(file);const m=S.meta;
  if(!rows.length)return{error:t('data.no_sheet')};
  const plan={sheets,total:rows.length,updates:[],adds:[],same:0,skipped:0,errors:[]};
  const dset=[...new Set(rows.map(r=>r.dist))];const maps={};
  for(const d of dset){const dn=m.districts.find(x=>x.n.toLowerCase()===d.toLowerCase());if(!dn)continue;setMsg(t('data.checking')+' '+dn.n+'…');const arr=await loadDistrict(dn.n);const mp=new Map();for(const r of arr)mp.set(r[1],r);maps[d]=mp}
  const seen=new Set();
  for(const x of rows){
    const dn=m.districts.find(d=>d.n.toLowerCase()===x.dist.toLowerCase());
    if(!x.id||!x.end||!dn||!x.office){if(plan.errors.length<200)plan.errors.push(`${x.sheet} row ${x.line}: ${!dn?'unknown district "'+x.dist+'"':!x.end?'unreadable INSR_END':'missing policy ID or branch'}`);continue}
    if(seen.has(x.id)){continue}seen.add(x.id);
    const s=x.st==='renewed'?'R':x.st==='not renewed'?'N':x.st==='new'?'NEW':'';
    let rs=-1,nt='';if(s==='N'&&x.rs){rs=m.reasons.findIndex(z=>z.trim().toLowerCase()===x.rs.toLowerCase());if(rs<0)nt='Reason: '+x.rs}
    const exist=maps[x.dist]&&maps[x.dist].get(x.id),cur=S.tidx.get(x.id);
    if(exist||cur){
      if(!s){plan.skipped++;continue}
      const c=cur&&cur.rec;if(c&&c.s===s&&(c.rp||'')===(s==='R'?x.rp:'')&&(c.rs??-1)===(s==='N'?rs:-1)){plan.same++;continue}
      plan.updates.push({x,dn,s,rs,nt})
    }else plan.adds.push({x,dn,s,rs,nt})}
  return plan}
async function commitImport(plan,setProg){
  const m=S.meta,groups=new Map();let n=0;const tot=plan.updates.length+plan.adds.length;
  const put=(it,isAdd)=>{const x=it.x,key=bkey(x.office,x.end,x.id);let g=groups.get(key);if(!g){g={office:x.office,district:it.dn.n,month:x.end.slice(0,7),recs:{}};groups.set(key,g)}
    const pd=m.products.indexOf(x.prod),old=S.tidx.get(x.id);
    const rec=Object.assign({},old?old.rec:{},{s:it.s,rp:it.s==='R'?x.rp:'',rs:it.s==='N'?it.rs:-1,as:old?old.rec.as||'':'',nt:(old&&old.rec.nt)||it.nt||'',pr:x.prem,pd,by:S.uid||'',at:Math.floor(Date.now()/1000)});
    if(pd<0)rec.pn=x.prod;
    if(isAdd){rec.add=1;rec.no=x.no;rec.nm=x.nm;rec.sc=m.sectors.indexOf(x.sec);rec.end=x.end;rec.sm=x.sum}
    g.recs[String(x.id)]=rec;n++};
  for(const it of plan.updates)put(it,false);for(const it of plan.adds)put(it,true);
  let done=0;const keys=[...groups.keys()];
  for(const k of keys){const g=groups.get(k);await saveBucket(k,g.office,g.district,g.month,g.recs);done++;setProg(done/keys.length)}
  return n}

  <div class="panel" id="deletedPanel" ${LocalDB.deleted.size===0?'hidden':''}><h2>${esc(t('data.restore_h'))}</h2><div class="sub">${esc(t('data.restore_s').replace('{n}', fmt0(LocalDB.deleted.size)))}</div>
    <div id="deletedList"></div>
  </div>
  </div>`;
  /* Validation panel: lightweight, runs on demand */
  const vbox=$('#vbox');
  vbox.innerHTML='<div class="muted">Checking…</div>';
  setTimeout(()=>vDataValidation(vbox),30);
  /* Restore-deleted list — render immediately so the panel is populated. */
  renderDeletedList();

  $('#exgo').onclick=async()=>{const w=$('#exw').value,msg=$('#exm');msg.textContent='Preparing…';
    try{if(w==='scope'){if(S.scope==='__all'&&!S.allWanted){msg.textContent='Choose one district in the selector first, or load all districts from the Policy register.';return}
        for(const n of scopeNames())await loadDistrict(n);const rows=scopeRows();await exportRows(rows,'renewal-list-'+slugOf(S.scope==='__all'?'all':S.scope)+'-'+TODAY_ISO+'.xlsx')}
      else{const ds=[...new Set([...S.tidx.values()].map(c=>c.district))];const list=[];for(const d of ds){await loadDistrict(d);for(const r of rowsFor(d)){if(S.tidx.has(r[1]))list.push(r)}}await exportRows(list,'tracked-renewals-'+TODAY_ISO+'.xlsx')}
      msg.textContent=''}catch(e){msg.textContent='Export failed: '+(e.message||'error')}};
  $('#bkgo').onclick=()=>{const o={app:'insurance-renewal-manager',version:3,exportedAt:new Date().toISOString(),staff:S.staff,track:Object.fromEntries(S.trackDocs),added:Object.fromEntries(LocalDB.added),edits:Object.fromEntries([...LocalDB.edits.entries()].map(([k,v])=>[String(k),v])),deleted:[...LocalDB.deleted],deletedRows:Object.fromEntries([...LocalDB.deletedRows.entries()].map(([k,v])=>[String(k),v]))};saveFile('renewal-backup-'+TODAY_ISO+'.json',JSON.stringify(o))};
  if(mgr){$('#imf').onchange=async e=>{const f=e.target.files[0],out=$('#imo');if(!f)return;
      if(typeof XLSX==='undefined'){out.innerHTML='<div class="note bad">The Excel library did not load. Check your connection and reload.</div>';return}
      out.innerHTML='<div class="muted" id="imm">'+esc(t('data.reading'))+'</div>';
      try{const plan=await planImport(f,txt=>{const x=$('#imm');if(x)x.textContent=txt});
        if(plan.error){out.innerHTML=`<div class="note bad">${esc(plan.error)}</div>`;return}
        const ch=plan.updates.length+plan.adds.length;
        out.innerHTML=`<div class="note"><b>${fmt0(plan.total)}</b> rows read from ${esc(plan.sheets.join(', '))}.</div><table><tbody>
          <tr><td>${esc(t('data.updates'))}</td><td class="r num"><b>${fmt0(plan.updates.length)}</b></td></tr>
          <tr><td>${esc(t('data.adds'))}</td><td class="r num"><b>${fmt0(plan.adds.length)}</b></td></tr>
          <tr><td>${esc(t('data.same'))}</td><td class="r num">${fmt0(plan.same)}</td></tr>
          <tr><td>${esc(t('data.skipped'))}</td><td class="r num">${fmt0(plan.skipped)}</td></tr>
          <tr><td>${esc(t('data.problems'))}</td><td class="r num">${fmt0(plan.errors.length)}</td></tr>
          ${plan.errors.length?`<tr><td colspan="2"><details><summary>${esc(t('data.show_problems'))}</summary><ul class="clean" style="font-size:12.5px">${plan.errors.slice(0,20).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details></td></tr>`:''}
          </tbody></table>
          <div class="row" style="margin-top:10px"><button class="btn primary" id="imgo" ${ch?'':'disabled'}>${esc(t('data.apply_btn'))} ${fmt0(ch)} ${esc(t('data.changes'))}</button><span class="muted" id="imp"></span></div><div class="prog" id="impb" hidden><div></div></div>`;
        $('#imgo').onclick=async()=>{$('#imgo').disabled=true;$('#impb').hidden=false;try{const n=await commitImport(plan,p=>{$('#impb>div').style.width=(p*100)+'%'});$('#imp').textContent=t('data.done')+' '+fmt0(n)+' '+t('data.records_saved');toast(t('data.import_complete'))}catch(er){$('#imp').textContent=t('data.stopped')+' '+(er.message||er.code)+'. '+t('data.records_kept');$('#imgo').disabled=false}}
      }catch(er){out.innerHTML=`<div class="note bad">${esc(t('data.could_not'))} ${esc(er.message||er)}</div>`}}}
  if(admin){$('#rsf').onchange=async e=>{const f=e.target.files[0],out=$('#rso');if(!f)return;
      try{const o=JSON.parse(await f.text());if(o.app!=='insurance-renewal-manager')throw new Error(t('data.not_backup'));
        const tk=Object.keys(o.track||{}),sk=Object.keys(o.staff||{}),ak=Object.keys(o.added||{}),ek=Object.keys(o.edits||{}),dk=(o.deleted||[]).length,drk=Object.keys(o.deletedRows||{});
        out.innerHTML=`<div class="note warn">${esc(t('data.restore_warn'))} ${tk.length} ${esc(t('data.restore_groups'))} · ${sk.length} ${esc(t('data.restore_staff'))}${dk?` · ${dk} ${esc(t('data.restore_deleted').toLowerCase())}`:''}${ek.length?` · ${ek.length} ${esc(t('data.restore_edits').toLowerCase())}`:''}</div><div class="row"><button class="btn primary" id="rsgo">${esc(t('data.restore_btn'))}</button><span class="muted" id="rsm"></span></div>`;
        $('#rsgo').onclick=async()=>{$('#rsgo').disabled=true;try{let i=0;for(const k of tk){await S.db.collection('track').doc(k).set(o.track[k]);$('#rsm').textContent=(++i)+' / '+tk.length}
          for(const k of sk)await S.db.collection('staff').doc(k).set(o.staff[k]);
          if(o.added)for(const [k,v] of Object.entries(o.added)){LocalDB.added.set(k,v);LocalDB.saveAdded()}
          if(o.edits)for(const [k,v] of Object.entries(o.edits)){LocalDB.edits.set(Number(k),v);LocalDB.saveEdits()}
          if(o.deleted)for(const id of o.deleted){LocalDB.deleted.add(Number(id));LocalDB.saveDeleted()}
          if(o.deletedRows)for(const [k,v] of Object.entries(o.deletedRows)){LocalDB.deletedRows.set(Number(k),v);LocalDB.saveDeletedRows()}
          rebuild();
          $('#rsm').textContent=t('data.done');toast(t('data.import_complete'))}catch(er){$('#rsm').textContent=t('data.stopped')+' '+(er.message||er.code);$('#rsgo').disabled=false}}}
      catch(er){out.innerHTML=`<div class="note bad">${esc(er.message||t('data.could_not'))}</div>`}}}}
function vDataValidation(box){
  const m=S.meta;
  /* lightweight integrity check (uses meta + what's been loaded already) */
  const checks=[];
  const distCount=m.districts.length;
  let policyTotal=0;for(const d of m.districts)policyTotal+=d.count;
  const officeSet=new Set(m.offices.map(o=>o.n));
  const officeD=m.offices.every(o=>o.d>=0&&o.d<m.districts.length);
  const reasonsCount=m.reasons.length;
  const monthsCount=m.months.length;
  const aggRows=m.agg.length;

  /* Agg check: for each district, count the records in agg and compare to meta.districts[i].count */
  const perDistAgg=m.districts.map((d,i)=>{let c=0,p=0;for(const a of m.agg)if(a[0]===i){c+=a[4];p+=a[5]}return{d,i,c,p}});
  const mismatchedAgg=perDistAgg.filter(x=>x.c!==m.districts[x.i].count);

  const card=(cls,l,v,d)=>`<div class="vcard ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;

  box.innerHTML=`<div class="vgrid">
    ${card(mismatchedAgg.length===0?'ok':'warn',t('data.v_districts'),fmt0(distCount),mismatchedAgg.length===0?'All districts have files':`${mismatchedAgg.length} district(s) aggregate count mismatch`)}
    ${card(officeD?'ok':'bad',t('data.v_offices'),fmt0(m.offices.length),officeD?'All branches mapped to a district':'Some branches lack a district mapping')}
    ${card('ok',t('data.v_policies'),fmt0(policyTotal),'Across all districts (per meta.json)')}
    ${card(aggRows>0?'ok':'bad',t('data.v_agg_rows'),fmt0(aggRows),aggRows>0?'Pre-computed aggregates present':'Missing — dashboard charts may be empty')}
    ${card('ok',t('data.v_tracked'),fmt0(S.tidx.size),'Renewal statuses stored in this browser')}
    ${card(LocalDB.deleted.size===0?'ok':'warn',t('data.v_deleted'),fmt0(LocalDB.deleted.size),LocalDB.deleted.size===0?'No deleted policies':`${LocalDB.deleted.size} policy/policies deleted — restore from below`)}
    ${card('ok',t('data.v_added'),fmt0(LocalDB.added.size),'Manually added policies in this browser')}
    ${card('ok',t('data.v_officers'),fmt0(Object.keys(S.staff).length),'Officers configured in this browser')}
    ${card(monthsCount>=12?'ok':'warn','Months',fmt0(monthsCount),monthsCount>=12?'Full 12-month window':'Partial month window')}
    ${card(reasonsCount>=5?'ok':'warn','Reasons',fmt0(reasonsCount),reasonsCount>=5?'Non-renewal reasons configured':'Few reasons configured')}
  </div>
  ${mismatchedAgg.length?`<div class="note warn" style="margin-top:10px"><b>Aggregate mismatch in:</b> ${esc(mismatchedAgg.map(x=>m.districts[x.i].n+' ('+fmt0(x.c)+' vs '+fmt0(m.districts[x.i].count)+')').join(', '))}.<br>This only affects the dashboard and report totals. The per-policy register is unaffected — open a district to see its policies.</div>`:''}
  <div class="muted" style="font-size:12px;margin-top:8px">Validation runs from meta.json. To check raw rows in a district, open it from the Policy register.</div>`;
}

/* ===================== Restore deleted list ===================== */
function renderDeletedList(){
  const box=$('#deletedList');if(!box)return;
  const panel=$('#deletedPanel');
  const ids=[...LocalDB.deleted];
  if(ids.length===0){if(panel)panel.hidden=true;box.innerHTML='';return}
  if(panel)panel.hidden=false;
  /* Build a small table of deleted policies using their captured metadata. */
  const rows=[];
  for(const id of ids){
    const meta=LocalDB.deletedRows.get(id)||{};
    const no=meta.row?meta.row[0]:'—';
    const nm=meta.row?meta.row[2]:(meta.track&&meta.track.rec?meta.track.rec.nm:'—');
    const district=meta.track?meta.track.district:(meta.row?(typeof meta.row[9]==='number'&&S.meta.districts[meta.row[9]]?S.meta.districts[meta.row[9]].n:meta.row[9]):'—');
    const branch=meta.track?meta.track.office:(meta.row?(typeof meta.row[3]==='number'&&S.meta.offices[meta.row[3]]?S.meta.offices[meta.row[3]].n:meta.row[3]):'—');
    const end=meta.row?meta.row[6]:(meta.track&&meta.track.rec?meta.track.rec.end:'—');
    const prem=meta.row?meta.row[7]:(meta.track&&meta.track.rec?meta.track.rec.pr:0);
    const deletedAt=meta.deletedAt?new Date(meta.deletedAt).toLocaleDateString():'—';
    rows.push(`<tr>
      <td class="mono">${esc(no)}</td>
      <td>${esc(nm)}</td>
      <td>${esc(district)}</td>
      <td>${esc(branch)}</td>
      <td class="num">${end&&end.length>=10?fd(end):end}</td>
      <td class="r num">${fmt(prem)}</td>
      <td class="muted" style="font-size:11.5px">${deletedAt}</td>
      <td><button class="btn sm" data-restore="${id}">${esc(t('data.restore_one'))}</button></td>
    </tr>`);
  }
  box.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px">
    <span class="muted"><b style="color:var(--fg)">${fmt0(ids.length)}</b> ${esc(t('data.restore_count').split('|')[0])}</span>
    <div class="row"><button class="btn sm" id="restoreAll">${esc(t('data.restore_all'))}</button></div>
  </div>
  <div class="tablewrap" style="max-height:360px"><table><thead><tr>
    <th>${esc(t('pol.col_no'))}</th><th>${esc(t('pol.col_insured'))}</th><th>${esc(t('drawer.district'))}</th><th>${esc(t('drawer.branch'))}</th><th>${esc(t('drawer.end'))}</th><th class="r">${esc(t('drawer.premium'))}</th><th>${esc(t('data.deleted_on'))}</th><th></th>
  </tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  $('#restoreAll').onclick=async()=>{await restoreAllDeleted();toast(t('data.restore_done'));renderDeletedList();scheduleRender()};
  $$('[data-restore]',box).forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.restore);await restorePolicy(id);toast(t('data.restore_one_done'));renderDeletedList();scheduleRender()});
}

/* ===================== Routing & init ===================== */
function route(){const h=location.hash.slice(1);S.view=VIEWS.some(v=>v[0]===h)?h:'dashboard';if(S.view!=='alerts')S.alertLimit=100;
  if(S.meta){if(S.view==='policies'||S.view==='alerts')ensureScope();render();
    requestAnimationFrame(()=>{const a=document.querySelector('.nav a[aria-current="page"]');if(a)a.scrollIntoView({block:'nearest',inline:'nearest'})});
  }}
window.addEventListener('hashchange',route);
$('#scope').onchange=e=>{S.scope=e.target.value;store.set('irm.scope',S.scope);S.pol.page=0;S.pol.office='';S.loadErr='';ensureScope();render()};

/* Export to PDF button — opens the browser's print dialog with "Save as PDF" pre-selected. */
/* The print stylesheet shows the EIC logo + report name at the top of every page. */
$('#pdfBtn').onclick=()=>{
  updatePrintHeader();
  /* Give the layout a tick to settle before the browser snapshots it. */
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));
};

/* Language & theme toggles */
$('#langToggle').onclick=()=>{LANG=LANG==='en'?'am':'en';try{localStorage.setItem('irm.lang',LANG)}catch(e){}applyLang();if(S.meta)render();
  requestAnimationFrame(()=>{const a=document.querySelector('.nav a[aria-current="page"]');if(a)a.scrollIntoView({block:'nearest',inline:'nearest'})});
};
$('#themeToggle').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')||'auto';
  const next=cur==='auto'?'light':cur==='light'?'dark':'auto';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('irm.theme',next)}catch(e){}
  $('#themeLabel').textContent=next==='auto'?'Auto':next==='light'?'☀':'☾';
};

async function init(){
  /* restore theme + lang */
  const savedTheme=store.get('irm.theme')||'auto';
  document.documentElement.setAttribute('data-theme',savedTheme);
  $('#themeLabel').textContent=savedTheme==='auto'?'Auto':savedTheme==='light'?'☀':'☾';
  applyLang();

  S.view=VIEWS.some(v=>v[0]===location.hash.slice(1))?location.hash.slice(1):'dashboard';
  $('#view').innerHTML='<div class="panel empty"><b>Loading renewal portfolio…</b></div>';
  LocalDB.load();

  /* Use the local backend instead of Claude.ai APIs */
  S.db=LocalDB;
  S.userCap=LocalUser;
  S.dlCap=LocalDL;
  S.uid='local-admin';
  S.isOwner=true;
  S.isEditor=true;
  S.dataWrite=true;

  /* If no officers exist, seed the local-admin as an administrator */
  if(!LocalDB.staff.has('local-admin')){
    LocalDB.staff.set('local-admin',{name:'You',role:'admin',districts:[],email:'',active:true});
    LocalDB.saveStaff();
  }

  /* meta is required by almost everything — fetch first */
  try{S.meta=await fetch('data/meta.json').then(r=>r.json())}
  catch(e){$('#view').innerHTML='<div class="panel empty"><b>Could not load the portfolio</b>Reload the page to try again.</div>';return}

  const saved=store.get('irm.scope');
  S.scope=saved&&(saved==='__all'||S.meta.districts.some(d=>d.n===saved))?saved:(S.meta.districts.find(d=>d.n==='NEKEMTE')?'NEKEMTE':S.meta.districts[0].n);

  /* Pull staff + track from the local store, in the same shape the original onSnapshot callbacks produced */
  S.staff=Object.fromEntries(LocalDB.staff.entries());
  S.profiles={'local-admin':{name:'You'}};
  S.trackDocs=new Map(LocalDB.track.entries());
  rebuild();
  S.staffReady=true;S.trackReady=true;S.trackErr=null;

  fillScope();
  render();
  ensureScope();
}
init();
})();
</script>
<script>
/* ============================================================
 * Progressive Web App: service worker registration, install
 * prompt, network status dot, and update banner.
 * ============================================================ */
(function(){
  'use strict';

  /* ---------- Network status dot ---------- */
  const netDot = document.getElementById('netStatus');
  function updateNetDot(){
    if(!netDot) return;
    if(navigator.onLine){
      netDot.classList.remove('offline','uncached');
      netDot.title = 'Online';
    } else {
      netDot.classList.add('offline');
      netDot.classList.remove('uncached');
      netDot.title = 'Offline';
    }
  }
  if(netDot){
    updateNetDot();
    window.addEventListener('online',  ()=>{updateNetDot(); if(window.toast) window.toast(t('pwa.online')); /* Re-render the contextual banner now that we're back online */ if(window.setBanner) setBanner()});
    window.addEventListener('offline', ()=>{updateNetDot(); if(window.toast) window.toast(t('pwa.offline')); if(window.setBanner) setBanner()});
  }

  /* ---------- Install button (Chrome/Android/Edge desktop) ---------- */
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    if(installBtn) installBtn.hidden = false;
  });
  if(installBtn){
    installBtn.addEventListener('click', async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if(outcome === 'accepted' && window.toast) window.toast(t('pwa.installed'));
      deferredPrompt = null;
      installBtn.hidden = true;
    });
  }
  window.addEventListener('appinstalled', ()=>{
    if(installBtn) installBtn.hidden = true;
    if(window.toast) window.toast(t('pwa.installed'));
  });

  /* Detect iOS (no beforeinstallprompt) — show a hint after a few seconds */
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS && !window.matchMedia('(display-mode: standalone)').matches && !window.navigator.standalone){
    setTimeout(()=>{
      if(window.toast) window.toast(t('pwa.ios_hint'));
    }, 5000);
  }

  /* ---------- Service worker registration + update banner ---------- */
  if('serviceWorker' in navigator){
    const updateBanner = document.getElementById('updateBanner');
    const updateBtn = document.getElementById('updateBtn');
    let refreshing = false;

    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').then((reg)=>{
        // Check for updates every 60 minutes while the page is open.
        setInterval(()=>{ try { reg.update() } catch(e){} }, 60 * 60 * 1000);

        reg.addEventListener('updatefound', ()=>{
          const newWorker = reg.installing;
          if(!newWorker) return;
          newWorker.addEventListener('statechange', ()=>{
            // If a new SW has finished installing but the old one is still
            // running, show the update banner.
            if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
              if(updateBanner) updateBanner.hidden = false;
            }
            // If a new SW took over (no controller means first install), no banner.
          });
        });
      }).catch((err)=>{
        console.warn('[sw] registration failed:', err);
      });
    });

    if(updateBtn){
      updateBtn.addEventListener('click', ()=>{
        if(refreshing) return;
        refreshing = true;
        try{ navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage('skipWaiting'); }catch(e){}
        setTimeout(()=>window.location.reload(), 300);
      });
    }

    // When the new SW takes over (fires on next navigation/reload), reload
    // automatically if the user hasn't already.
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  } else {
    if(netDot){
      netDot.classList.add('uncached');
      netDot.title = 'Service workers not supported — offline mode unavailable';
    }
  }
})();
</script>
